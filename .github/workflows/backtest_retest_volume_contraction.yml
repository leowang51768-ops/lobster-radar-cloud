name: Backtest Retest Volume Contraction
# Formal v4 verification

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backtest_retest_volume_contraction.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Compile scripts
        run: python -m py_compile buy_signal.py backtest_new_rules.py backtest_retest_volume_contraction.py

      - name: Run retest volume contraction backtest
        run: python backtest_retest_volume_contraction.py

      - name: Commit comparison results
        run: |
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"
          git add backtest_retest_volume_contraction_results.json backtest_retest_volume_contraction_report.md
          if git diff --cached --quiet; then
            echo "No comparison changes."
            exit 0
          fi
          git commit -m "Backtest retest volume contraction"
          git push
