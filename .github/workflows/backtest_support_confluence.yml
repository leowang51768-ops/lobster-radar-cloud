name: Backtest support confluence

on:
  workflow_dispatch:
  push:
    paths:
      - "support_retest_watch.py"
      - "backtest_support_confluence.py"
      - ".github/workflows/backtest_support_confluence.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest_support_confluence.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_support_confluence_results.json backtest_support_confluence_trades.csv
          git diff --cached --quiet || git commit -m "Save support confluence backtest results"
          git push
