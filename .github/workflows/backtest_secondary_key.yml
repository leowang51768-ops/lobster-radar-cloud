name: Lobster Secondary Pullback Key Backtest

on:
  push:
    paths:
      - 'backtest_secondary_pullback_key.py'
      - '.github/workflows/backtest_secondary_key.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest-secondary-key:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas
      - name: Run secondary-key backtest
        run: python backtest_secondary_pullback_key.py
      - name: Commit secondary-key backtest results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest_secondary_key_results.json
          if git diff --cached --quiet; then
            echo "No secondary-key backtest result changes"
          else
            git commit -m "Update secondary-key backtest results"
            git push
          fi
