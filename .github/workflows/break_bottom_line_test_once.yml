name: Break Bottom Actual Scan LINE Test
# actual database scan: 2026-09-21 trigger-1

on:
  push:
    paths:
      - ".github/workflows/break_bottom_line_test_once.yml"

jobs:
  run-actual-break-bottom-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Read official database and send actual break-bottom result
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          BUY_FORCE_NOTIFY: "1"
        run: python buy_signal.py
