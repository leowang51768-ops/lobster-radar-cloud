name: Backtest 20MA Protection

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backtest_20ma_protection.yml"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Compile scripts
        run: python -m py_compile buy_signal.py backtest_new_rules.py backtest_20ma_protection.py

      - name: Run 20MA protection backtest
        run: python backtest_20ma_protection.py

      - name: Commit comparison results
        run: |
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"
          git add backtest_20ma_protection_results.json backtest_20ma_protection_report.md
          if git diff --cached --quiet; then
            echo "No comparison changes."
            exit 0
          fi
          git commit -m "Backtest new patterns with two 20MA protections"
          git push
