name: Lobster Daily Price Update

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date YYYY-MM-DD for manual testing"
        required: false
        type: string
  # One-purpose push trigger used only when we intentionally touch the trigger file.
  push:
    paths:
      - ".github/lobster-manual-trigger"
  schedule:
    # 台北時間週一至週五 16:30 正式執行；16:45 備援補跑。
    # GitHub cron 使用 UTC，所以 16:30 / 16:45 台北 = 08:30 / 08:45 UTC。
    - cron: "30 8 * * 1-5"
    - cron: "45 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lobster-daily-price-update
  cancel-in-progress: false

jobs:
  update-price-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signal dependencies
        run: pip install pandas requests

      - name: Get trade date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            echo "TRADE_DATE=${{ github.event.inputs.trade_date }}" >> "$GITHUB_ENV"
          else
            echo "TRADE_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"
          fi
          echo "FAIL_STAGE=初始化" >> "$GITHUB_ENV"

      - name: Check Taiwan market calendar
        id: market_calendar
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date

          trade_date = os.environ["TRADE_DATE"]
          d = date.fromisoformat(trade_date)
          holidays = {
              "2026-01-01",
              "2026-02-12","2026-02-13","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20",
              "2026-02-27",
              "2026-04-03","2026-04-06",
              "2026-05-01","2026-06-19",
              "2026-09-25","2026-09-28",
              "2026-10-09","2026-10-26","2026-12-25",
          }
          closed = d.weekday() >= 5 or trade_date in holidays
          print("closed=" + ("true" if closed else "false"))
          print("reason=" + ("TWSE scheduled closure" if closed else "trading day"))
          PY

      - name: Market closed notice
        if: ${{ steps.market_calendar.outputs.closed == 'true' }}
        run: echo "TWSE closed on $TRADE_DATE; skip market scan and LINE stock notification without failure."

      - name: Update official TWSE and TPEx prices with auto retry
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        run: |
          echo "FAIL_STAGE=官方股價更新" >> "$GITHUB_ENV"
          echo "Requested trade date: $TRADE_DATE"
          EXISTING_ROWS=$(python - <<'PY'
          import os, sqlite3
          con = sqlite3.connect('lobster_tw_6m_prices.sqlite')
          n = con.execute('SELECT COUNT(*) FROM prices WHERE date=?', (os.environ['TRADE_DATE'],)).fetchone()[0]
          con.close()
          print(n)
          PY
          )
          echo "Existing rows for $TRADE_DATE: $EXISTING_ROWS"
          if [ "$EXISTING_ROWS" -gt 0 ]; then
            echo "Trade date already exists; skip refetch and continue to signal evaluation."
          else
            success=0
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Price update attempt $attempt/8"
              if python incremental_update.py "$TRADE_DATE"; then
                success=1
                break
              fi
              if [ "$attempt" -lt 8 ]; then
                echo "Official market data not fully available; wait 3 minutes and retry."
                sleep 180
              fi
            done
            if [ "$success" -ne 1 ]; then
              echo "Official price update failed after 8 attempts; no LINE stock notification."
              exit 1
            fi
          fi

      - name: Verify database health
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        run: |
          echo "FAIL_STAGE=資料庫驗證" >> "$GITHUB_ENV"
          python - <<'PY'
          import os
          import sqlite3

          db = "lobster_tw_6m_prices.sqlite"
          assert os.path.exists(db), "Database file missing"

          con = sqlite3.connect(db)
          latest = con.execute(
              "SELECT value FROM metadata WHERE key='latest_trade_date'"
          ).fetchone()
          count = con.execute(
              "SELECT COUNT(*) FROM prices WHERE date=?",
              (os.environ["TRADE_DATE"],)
          ).fetchone()[0]
          cols = [r[1] for r in con.execute("PRAGMA table_info(prices)").fetchall()]
          con.close()

          print("latest_trade_date =", latest[0] if latest else None)
          print("rows for trade date =", count)
          print("prices columns =", cols)

          assert count > 0, f"No rows for requested trade date {os.environ['TRADE_DATE']}"
          required = {"date","market","stock_id","stock_name","open","high","low","close","volume","turnover"}
          assert required.issubset(set(cols)), f"Unexpected prices schema: {cols}"
          PY

      # Keep each strategy's scanner and formal performance bookkeeping, but
      # suppress their individual stock broadcasts. One combined digest below
      # is the sole LINE stock-list sender (maximum five distinct tickers).
      - name: Evaluate integrated Lobster buy points (CSV and tracking only)
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ""
        run: |
          echo "FAIL_STAGE=破底翻及正式買點掃描" >> "$GITHUB_ENV"
          python buy_signal.py

      - name: Scan VCP stages (CSV only)
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ""
        run: |
          echo "FAIL_STAGE=VCP三階段掃描" >> "$GITHUB_ENV"
          python vcp_scan.py

      - name: Scan early volatility-contraction observations (CSV only, LINE disabled)
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ""
        run: |
          echo "FAIL_STAGE=初步波動收縮觀察掃描" >> "$GITHUB_ENV"
          python vcp_early_watch.py

      - name: Scan N-bottom observations (CSV and tracking only)
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ""
        run: |
          echo "FAIL_STAGE=N字底掃描" >> "$GITHUB_ENV"
          python support_retest_watch.py

      - name: "Send two-stage LINE: breakout candidates and retest confirmations"
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          echo "FAIL_STAGE=兩階段LINE通知" >> "$GITHUB_ENV"
          python combined_line_digest.py

      - name: Update daily LINE pick performance (5 10 20 sessions)
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        run: |
          echo "FAIL_STAGE=LINE推薦績效更新" >> "$GITHUB_ENV"
          python line_pick_tracking.py

      - name: Final health check
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        run: |
          echo "FAIL_STAGE=最終健康檢查" >> "$GITHUB_ENV"
          python - <<'PY'
          import csv
          import json
          import os
          import sqlite3
          from pathlib import Path

          trade_date = os.environ["TRADE_DATE"]
          db = Path("lobster_tw_6m_prices.sqlite")
          assert db.exists(), "Database missing at final health check"

          con = sqlite3.connect(db)
          rows = con.execute("SELECT COUNT(*) FROM prices WHERE date=?", (trade_date,)).fetchone()[0]
          con.close()
          assert rows > 0, f"No official price rows for {trade_date}"

          state = Path("signal_state.json")
          assert state.exists(), "signal_state.json missing"
          json.loads(state.read_text(encoding="utf-8"))

          candidates = Path("candidate_status.csv")
          assert candidates.exists(), "candidate_status.csv missing"
          with candidates.open("r", encoding="utf-8-sig", newline="") as f:
            reader = csv.reader(f)
            header = next(reader, None)
          assert header and "date" in header and "code" in header, "candidate_status.csv schema invalid"

          print(f"HEALTH_OK trade_date={trade_date} rows={rows}")
          PY

      - name: Commit updated database and signal state
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        run: |
          echo "FAIL_STAGE=結果寫回GitHub" >> "$GITHUB_ENV"
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"

          for f in lobster_tw_6m_prices.sqlite fundamental_support.json signal_state.json candidate_status.csv vcp_candidates.csv vcp_early_watch.csv n_bottom_watch.csv line_scan_diagnostics.csv formal_recommendations.csv line_pick_snapshots.csv line_pick_performance.csv breakout_watchlist.json breakout_tracking.json line_daily_send_state.json chip_candidate_snapshots.jsonl chip_candidate_outcomes.csv; do
            if [ -e "$f" ]; then
              git add "$f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No database, candidate-status, or signal-state changes to commit."
            exit 0
          fi

          git commit -m "Update official prices candidates and buy signals ${TRADE_DATE}"
          git push

      - name: LINE alert when daily workflow still fails
        if: ${{ failure() && github.event_name == 'schedule' && steps.market_calendar.outputs.closed != 'true' }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from pathlib import Path

          trade_date = os.environ.get("TRADE_DATE", "unknown")
          state_path = Path("line_daily_send_state.json")
          if state_path.exists():
              try:
                  sent_state = json.loads(state_path.read_text(encoding="utf-8"))
                  if (sent_state.get(trade_date) or {}).get("daily_result_sent"):
                      print("Daily LINE result already sent; suppress duplicate backup failure alert")
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print("Could not read LINE send state:", repr(e))

          token = os.environ.get("LINE_CHANNEL_ACCESS_TOKEN", "").strip()
          if not token:
              print("LINE token missing; cannot send failure alert")
              raise SystemExit(0)

          stage = os.environ.get("FAIL_STAGE", "unknown")
          now = datetime.now(ZoneInfo("Asia/Taipei")).strftime("%Y-%m-%d %H:%M")
          text = (
              "🚨 龍蝦系統執行失敗\n"
              f"交易日：{trade_date}\n"
              f"失敗階段：{stage}\n"
              f"時間：{now}\n"
              "系統已完成內建重試，但仍未恢復。請檢查 GitHub Actions。"
          )
          payload = json.dumps({"messages": [{"type": "text", "text": text}]}, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              "https://api.line.me/v2/bot/message/broadcast",
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json; charset=UTF-8",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  print("Failure alert LINE status:", resp.status)
          except Exception as e:
              print("Failure alert itself failed:", repr(e))
          PY
