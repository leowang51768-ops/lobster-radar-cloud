name: Lobster Daily Price Update

on:
  workflow_dispatch:
  schedule:
    # 台北時間週一至週五 18:30
    # GitHub cron 使用 UTC，所以 18:30 台北 = 10:30 UTC
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lobster-daily-price-update
  cancel-in-progress: false

jobs:
  update-price-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get Taipei trade date
        run: |
          echo "TRADE_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"

      - name: Update official TWSE and TPEx prices
        run: |
          echo "Updating trade date: $TRADE_DATE"
          python incremental_update.py "$TRADE_DATE"

      - name: Verify database
        run: |
          python - <<'PY'
          import os
          import sqlite3

          db = "lobster_tw_6m_prices.sqlite"
          assert os.path.exists(db), "Database file missing"

          con = sqlite3.connect(db)
          latest = con.execute(
              "SELECT value FROM metadata WHERE key='latest_trade_date'"
          ).fetchone()
          count = con.execute(
              "SELECT COUNT(*) FROM prices WHERE date=?",
              (os.environ["TRADE_DATE"],)
          ).fetchone()[0]
          con.close()

          print("latest_trade_date =", latest[0] if latest else None)
          print("rows for trade date =", count)

          assert latest and latest[0] == os.environ["TRADE_DATE"]
          assert count > 0
          PY

      - name: Commit updated database
        run: |
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"

          git add lobster_tw_6m_prices.sqlite

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "Update official prices ${TRADE_DATE}"
          git push
