name: Official Prices for Branch Tracking

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date YYYY-MM-DD for manual testing"
        required: false
        type: string
  # Official prices only; radar and LINE are retired.
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "0 11 * * 1-5"
    - cron: "0 12 * * 1-5"
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lobster-daily-price-update
  cancel-in-progress: false

jobs:
  update-price-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signal dependencies
        run: pip install pandas requests

      - name: Verify price integrity regression tests
        run: python -m unittest discover -s tests -p test_price_integrity.py -v

      - name: Verify cross-day session tests
        run: python -m unittest discover -s tests -p test_scan_trade_date.py -v

      - name: Get trade date
        shell: bash
        env:
          MANUAL_TRADE_DATE: ${{ github.event.inputs.trade_date }}
        run: |
          echo "TRADE_DATE=$(python scan_trade_date.py)" >> "$GITHUB_ENV"
          echo "FAIL_STAGE=初始化" >> "$GITHUB_ENV"

      - name: Check Taiwan market calendar
        id: market_calendar
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date
          from scan_trade_date import is_trade_day
          closed = not is_trade_day(date.fromisoformat(os.environ["TRADE_DATE"]))
          print("closed=" + ("true" if closed else "false"))
          print("reason=" + ("TWSE scheduled closure" if closed else "trading day"))
          PY

      - name: Market closed notice
        if: ${{ steps.market_calendar.outputs.closed == 'true' }}
        run: echo "TWSE closed on $TRADE_DATE; skip official price update without failure."

      - name: Update official TWSE and TPEx prices with auto retry
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        run: |
          echo "FAIL_STAGE=官方股價更新" >> "$GITHUB_ENV"
          echo "Requested trade date: $TRADE_DATE"
          if python price_integrity.py; then
            echo "All tracked stocks have usable prices for $TRADE_DATE; skip refetch."
          else
            echo "Missing or invalid daily data; refetch both official markets."
            success=0
            for attempt in 1 2 3 4 5 6 7 8; do
              echo "Price update attempt $attempt/8"
              if [ "$attempt" -lt 8 ]; then
                # First seven attempts still prefer a complete tracked universe.
                # Valid rows are saved, but any missing stock triggers another retry.
                if python incremental_update.py "$TRADE_DATE"; then
                  success=1
                  break
                fi
              else
                # Final fallback: keep all valid official rows, quarantine only the
                # missing/invalid stocks, and continue the radar without stale prices.
                if python incremental_update.py "$TRADE_DATE" --allow-partial; then
                  success=1
                  break
                fi
              fi
              if [ "$attempt" -lt 8 ]; then
                echo "Official market data not fully available; wait 3 minutes and retry."
                sleep 180
              fi
            done
            if [ "$success" -ne 1 ]; then
              echo "Official price update failed after 8 attempts; source/system failure."
              exit 1
            fi
          fi

      - name: Verify database health
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        run: |
          echo "FAIL_STAGE=資料庫驗證" >> "$GITHUB_ENV"
          python price_integrity.py --allow-partial
          python - <<'PY'
          import os
          import sqlite3

          db = "lobster_tw_6m_prices.sqlite"
          assert os.path.exists(db), "Database file missing"

          con = sqlite3.connect(db)
          latest = con.execute(
              "SELECT value FROM metadata WHERE key='latest_trade_date'"
          ).fetchone()
          count = con.execute(
              "SELECT COUNT(*) FROM prices WHERE date=?",
              (os.environ["TRADE_DATE"],)
          ).fetchone()[0]
          cols = [r[1] for r in con.execute("PRAGMA table_info(prices)").fetchall()]
          con.close()

          print("latest_trade_date =", latest[0] if latest else None)
          print("rows for trade date =", count)
          print("prices columns =", cols)

          assert count > 0, f"No rows for requested trade date {os.environ['TRADE_DATE']}"
          required = {"date","market","stock_id","stock_name","open","high","low","close","volume","turnover"}
          assert required.issubset(set(cols)), f"Unexpected prices schema: {cols}"
          PY

      - name: Save official prices for branch tracking
        if: ${{ steps.market_calendar.outputs.closed != 'true' }}
        shell: bash
        run: |
          git config user.name "lobster-price-maintenance"
          git config user.email "actions@github.com"
          git add lobster_tw_6m_prices.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update official prices for branch tracking ${TRADE_DATE}"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          exit 1
