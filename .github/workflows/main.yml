name: Lobster Daily Price Update

on:
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional trade date YYYY-MM-DD for manual testing"
        required: false
        type: string
  schedule:
    # 台北時間週一至週五 18:30
    # GitHub cron 使用 UTC，所以 18:30 台北 = 10:30 UTC
    - cron: "30 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: lobster-daily-price-update
  cancel-in-progress: false

jobs:
  update-price-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install signal dependencies
        run: pip install pandas requests

      - name: Get trade date
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.trade_date }}" ]; then
            echo "TRADE_DATE=${{ github.event.inputs.trade_date }}" >> "$GITHUB_ENV"
          else
            echo "TRADE_DATE=$(TZ=Asia/Taipei date +%F)" >> "$GITHUB_ENV"
          fi

      - name: Update official TWSE and TPEx prices
        run: |
          echo "Requested trade date: $TRADE_DATE"
          EXISTING_ROWS=$(python - <<'PY'
          import os, sqlite3
          con = sqlite3.connect('lobster_tw_6m_prices.sqlite')
          n = con.execute('SELECT COUNT(*) FROM prices WHERE date=?', (os.environ['TRADE_DATE'],)).fetchone()[0]
          con.close()
          print(n)
          PY
          )
          echo "Existing rows for $TRADE_DATE: $EXISTING_ROWS"
          if [ "$EXISTING_ROWS" -gt 0 ]; then
            echo "Trade date already exists; skip refetch and continue to signal evaluation."
          else
            python incremental_update.py "$TRADE_DATE"
          fi

      - name: Verify database
        run: |
          python - <<'PY'
          import os
          import sqlite3

          db = "lobster_tw_6m_prices.sqlite"
          assert os.path.exists(db), "Database file missing"

          con = sqlite3.connect(db)
          latest = con.execute(
              "SELECT value FROM metadata WHERE key='latest_trade_date'"
          ).fetchone()
          count = con.execute(
              "SELECT COUNT(*) FROM prices WHERE date=?",
              (os.environ["TRADE_DATE"],)
          ).fetchone()[0]
          cols = [r[1] for r in con.execute("PRAGMA table_info(prices)").fetchall()]
          con.close()

          print("latest_trade_date =", latest[0] if latest else None)
          print("rows for trade date =", count)
          print("prices columns =", cols)

          assert count > 0, f"No rows for requested trade date {os.environ['TRADE_DATE']}"
          required = {"date","market","stock_id","stock_name","open","high","low","close","volume","turnover"}
          assert required.issubset(set(cols)), f"Unexpected prices schema: {cols}"
          PY

      - name: Update official fundamental support
        run: python fundamental_update.py

      - name: Evaluate Lobster buy points and send LINE alerts
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python buy_signal.py

      - name: Commit updated database and signal state
        run: |
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"

          git add lobster_tw_6m_prices.sqlite fundamental_support.json signal_state.json formal_recommendations.csv 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No database, fundamentals, or signal-state changes to commit."
            exit 0
          fi

          git commit -m "Update official prices fundamentals and buy signals ${TRADE_DATE}"
          git push
