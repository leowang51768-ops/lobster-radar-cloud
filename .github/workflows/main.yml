name: Lobster Cloud Test

on:
  workflow_dispatch:

jobs:
  cloud-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Confirm cloud execution
        run: |
          echo "Lobster Radar cloud runner started successfully"
          python --version
          date
