name: Run Strategy Radar & LINE Notification

on:
  workflow_run:
    workflows: ["Lobster Daily Price Update"]  # ⚠️ 請確保這裡填入 GPT 更新資料庫的 Workflow 名稱
    types:
      - completed

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}  # 資料庫成功更新後才啟動
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy requests

      - name: Execute Strategy Script
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
       run: python analyze_2454_signals.py
