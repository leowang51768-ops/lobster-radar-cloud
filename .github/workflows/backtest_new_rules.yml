name: Backtest New Buy Rules

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/backtest_new_rules.yml"
      - "buy_signal.py"
      - "backtest_fakeout_ab.py"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Compile strategy and backtest
        run: python -m py_compile buy_signal.py backtest_fakeout_ab.py
      - name: Run walk-forward A/B backtest
        run: python backtest_fakeout_ab.py
      - name: Commit backtest results
        run: |
          git config user.name "lobster-radar-cloud"
          git config user.email "actions@github.com"
          git add backtest_fakeout_ab_results.json backtest_fakeout_ab_report.md
          if git diff --cached --quiet; then
            echo "No backtest result changes."
            exit 0
          fi
          git commit -m "Backtest v9 high-quality breakout retest"
          git fetch origin main
          git rebase origin/main
          git push
