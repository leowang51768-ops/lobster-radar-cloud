name: Global Market Risk Newsroom

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-market-risk-newsroom
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and analyze global market risk
        run: python global_market_risk.py
      - name: Publish only when the displayed result changed
        shell: bash
        run: |
          if git diff --quiet -- data/global_market_risk.json; then
            echo "No material change; nothing to publish."
            exit 0
          fi
          git config user.name "ghost-market-newsroom"
          git config user.email "actions@users.noreply.github.com"
          git add data/global_market_risk.json
          git commit -m "update global market risk newsroom"

          # 與雷達主流程共用 repo 時，遇到對方剛好先推送就先 rebase 再重試。
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" || {
              echo "git pull --rebase failed on attempt $attempt"
              git rebase --abort || true
              sleep 8
              continue
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "git push conflict on attempt $attempt; retrying"
            sleep 8
          done
          echo "Failed to publish newsroom update after 4 retries."
          exit 1
