name: Global Market Risk Newsroom

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: global-market-risk-newsroom
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and analyze global market risk
        run: python global_market_risk.py
      - name: Publish only when the displayed result changed
        shell: bash
        run: |
          if git diff --quiet -- data/global_market_risk.json; then
            echo "No material change; nothing to publish."
            exit 0
          fi
          git config user.name "ghost-market-newsroom"
          git config user.email "actions@users.noreply.github.com"
          git add data/global_market_risk.json
          git commit -m "update global market risk newsroom"
          git push
