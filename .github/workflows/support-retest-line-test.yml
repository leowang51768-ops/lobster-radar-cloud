name: Support Retest LINE Test

on:
  workflow_dispatch:
  push:
    paths:
      - "support_retest_watch.py"

jobs:
  support-retest-line-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Run observation scanner and send LINE test
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SUPPORT_RETEST_FORCE_NOTIFY: "1"
        run: python support_retest_watch.py
