name: N Bottom LINE Test
on:
  workflow_dispatch:
  push:
    paths:
      - "support_retest_watch.py"
permissions:
  contents: read
jobs:
  n-bottom-line-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Scan N-bottom and send LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          N_BOTTOM_FORCE_NOTIFY: "1"
        run: python support_retest_watch.py
