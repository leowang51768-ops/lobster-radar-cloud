name: Support Retest LINE Test

on:
  workflow_dispatch:
  push:
    paths:
      - "support_retest_watch.py"

permissions:
  contents: write

jobs:
  support-retest-line-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pandas
      - name: Run observation scanner and send LINE test
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          SUPPORT_RETEST_FORCE_NOTIFY: "1"
        run: python support_retest_watch.py
      - name: Save prospective high-quality observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add support_retest_high_quality_history.csv
          git diff --cached --quiet || git commit -m "Track high-quality support retest observations"
          git push
