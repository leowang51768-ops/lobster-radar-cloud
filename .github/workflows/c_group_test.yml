name: C-group isolated scanner tests

on:
  push:
    branches:
      - experiment/c-group-quality-20260921
    paths:
      - c_group_scan.py
      - test_c_group_scan.py
      - support_retest_watch.py
      - .github/workflows/c_group_test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_c_group_scan.py
      - run: python c_group_scan.py --out-dir /tmp/c_group_output
