name: VCP LINE One-Time Test

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  send-vcp-line-test:
    if: github.event.head_commit.message == 'Run VCP LINE one-time test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas
      - name: Run article-aligned VCP and force LINE result
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          VCP_FORCE_NOTIFY: "1"
        run: python vcp_scan.py
