name: Independent Branch Evidence Tracking
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "branch_tracker/*.py"
      - "branch_tracker/tests/**"
      - "branch_tracker/data/extra_universe.json"
      - "branch_tracker/data/monitor_return_pool.json"
      - ".github/workflows/branch-tracking.yml"
      - "stock_universe.py"

  schedule:
    # 台灣時間 17:30 先跑一輪；20:40 正式更新；21:30 備援補跑。
    # GitHub cron 使用 UTC：17:30/20:40/21:30 台北 = 09:30/12:40/13:30 UTC。
    - cron: "30 9 * * 1-5"
    - cron: "40 12 * * 1-5"
    - cron: "30 13 * * 1-5"
permissions:
  contents: write
concurrency:
  group: independent-branch-tracking
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify parsers and deduplication
        id: verify
        run: python -m unittest discover -s branch_tracker/tests -v
      - name: Accumulate branch evidence only
        id: collect
        run: python branch_tracker/collect.py --history-budget 120
      - name: Refresh matured price and quantity observations
        if: ${{ always() }}
        run: python branch_tracker/price_relationship.py
      - name: Build readable daily evidence audit
        if: ${{ always() }}
        run: python branch_tracker/audit.py
      - name: Build final branch conclusions
        id: report
        if: ${{ always() }}
        run: python branch_tracker/final_result.py
      - name: Save successful evidence and coverage even on partial failure
        id: publish
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -d branch_tracker/data ]; then
            exit 0
          fi
          git config user.name "lobster-branch-tracking"
          git config user.email "actions@github.com"
          git add branch_tracker/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Accumulate independent branch evidence $(TZ=Asia/Taipei date +%F)"
          # Radar may have committed unrelated files while this job was running.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            # A binary SQLite conflict cannot be solved by repeating rebase.
            # Merge independent evidence rows into the current remote snapshot.
            cp branch_tracker/data/branches.sqlite "$RUNNER_TEMP/branch-local.sqlite"
            git fetch origin main
            git reset --hard origin/main
            python branch_tracker/merge_evidence.py "$RUNNER_TEMP/branch-local.sqlite" branch_tracker/data/branches.sqlite
            # Publishing must not depend on another network collection succeeding.
            python branch_tracker/price_relationship.py
            python branch_tracker/audit.py
            python branch_tracker/final_result.py
            git add branch_tracker/data
            git diff --cached --quiet && exit 0
            git commit -m "Merge independently collected branch evidence"
            sleep $((attempt * 10))
          done
          echo "Failed to publish branch evidence after retries"
          exit 1
      - name: Summarize branch tracking stages
        if: ${{ always() }}
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          {
            echo '### 分點追蹤執行結果'
            echo "- 解析測試：${VERIFY_OUTCOME:-skipped}"
            echo "- 來源採集：${COLLECT_OUTCOME:-skipped}"
            echo "- 候選報告：${REPORT_OUTCOME:-skipped}"
            echo "- 資料寫回：${PUBLISH_OUTCOME:-skipped}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: branch-evidence-${{ github.run_id }}
          path: branch_tracker/data/
          retention-days: 30

