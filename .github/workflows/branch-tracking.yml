name: Independent Branch Evidence Tracking
on:
  workflow_dispatch:
  push:
    paths:
      - "branch_tracker/final_result.py"
      - "stock_universe.py"
      - "branch_tracker/data/extra_universe.json"
  schedule:
    # 台灣時間20:40執行，21:00稽核前先收集分點資料
    - cron: "40 12 * * 1-5"
permissions:
  contents: write
concurrency:
  group: independent-branch-tracking
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify parsers and deduplication
        run: python -m unittest discover -s branch_tracker/tests -v
      - name: Accumulate branch evidence only
        run: python branch_tracker/collect.py --history-budget 120
      - name: Refresh matured price and quantity observations
        if: ${{ always() }}
        run: python branch_tracker/price_relationship.py
      - name: Build readable daily evidence audit
        if: ${{ always() }}
        run: python branch_tracker/audit.py
      - name: Build final branch conclusions
        if: ${{ always() }}
        run: python branch_tracker/final_result.py
      - name: Save successful evidence and coverage even on partial failure
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -d branch_tracker/data ]; then
            exit 0
          fi
          git config user.name "lobster-branch-tracking"
          git config user.email "actions@github.com"
          git add branch_tracker/data
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Accumulate independent branch evidence $(TZ=Asia/Taipei date +%F)"
          # Radar may have committed unrelated files while this job was running.
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 10))
          done
          echo "Failed to publish branch evidence after retries"
          exit 1
