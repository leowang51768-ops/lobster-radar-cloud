name: Apply Primary Key Live Optimization

on:
  push:
    paths:
      - 'apply_primary_key_live_optimization.py'
      - '.github/workflows/apply_primary_key_live_optimization.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply optimization
        run: python apply_primary_key_live_optimization.py

      - name: Syntax check
        run: python -m py_compile buy_signal.py

      - name: Commit optimized live rules
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buy_signal.py
          if git diff --cached --quiet; then
            echo "No live-rule changes"
          else
            git commit -m "Promote primary key breakout to green-light formal route"
            git push
          fi
